name: Daily content routines

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  routines:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run routine generators
        run: |
          python scripts/update-fleet-data.py
          python scripts/generate-visuals.py

      - name: Push generated routine updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/fleet-data.ts public/visuals
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh routine-generated content assets"
            git push
          else
            echo "No routine-generated changes to push."
          fi

