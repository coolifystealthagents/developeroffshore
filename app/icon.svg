<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Developer Offshore logo</title>
  <desc id="desc">A custom offshore developer console mark with a DO wordmark monogram.</desc>
  <defs>
    <linearGradient id="bg" x1="12" y1="10" x2="118" y2="122" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#020617" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="34" fill="#fff8ee"/>
  <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#bg)" filter="url(#shadow)"/>
  <g transform="translate(16 8) scale(1)">
  <path d="M32 37 20 48l12 11" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M64 37 76 48 64 59" fill="none" stroke="#a78bfa" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M54 28 42 68" fill="none" stroke="#fff8ee" stroke-width="6" stroke-linecap="round"/>
  <rect x="22" y="74" width="52" height="6" rx="3" fill="#38bdf8" opacity=".75"/>
  </g>
  <rect x="18" y="88" width="92" height="25" rx="12.5" fill="rgba(0,0,0,.24)"/>
  <text x="64" y="106" text-anchor="middle" font-family="Inter, Manrope, Arial, sans-serif" font-size="17" font-weight="900" letter-spacing="-.5" fill="#fff8ee">DO</text>
</svg>
